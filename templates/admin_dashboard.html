<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a1a; 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 2vh 20px; 
        }
        
        h1 { 
            font-size: clamp(28px, 4vw, 48px); /* Scales font slightly on smaller screens */
            margin-top: 0;
            margin-bottom: 5px; 
        }
        
        #timer { 
            font-size: clamp(18px, 3vw, 24px); 
            color: #ff4757; 
            font-weight: bold; 
            margin-bottom: 2vh; 
        }

        /* QR Code Section - Maximized for Projectors */
        #qr-container { 
            background: white; 
            padding: 2vmin; 
            border-radius: 20px; 
            margin: 0 auto;
            /* Forces it to take up 90% of screen width, OR 70% of screen height (whichever is smaller) */
            width: 90vw; 
            max-width: 70vh; 
            aspect-ratio: 1 / 1; 
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #qrcode {
            width: 100%;
            height: 100%;
        }

        /* Override qrcode.js hardcoded pixel sizes to make it fluid */
        #qrcode img, #qrcode canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }
        
        /* Settings Section - Pushed down below */
        .settings-panel { 
            margin: 8vh auto 40px auto; 
            padding: 20px; 
            background: #2f3542; 
            border-radius: 12px; 
            display: block; 
            max-width: 400px; 
            width: 100%; 
            box-sizing: border-box;
        }
        
        .settings-panel h3 { margin-top: 0; }
        .input-group { margin: 15px 0; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; }
        input[type="number"] { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #1a1a1a; color: white; font-size: 16px; box-sizing: border-box; }
        
        /* Password Modal */
        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #2f3542; padding: 40px; border-radius: 12px; width: 300px; box-sizing: border-box; }
        input[type="password"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: none; box-sizing: border-box; font-size: 16px; background: #1a1a1a; color: white; }
        button { width: 100%; padding: 12px; background: #3742fa; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #5352ed; }
        #error-msg { color: #ff4757; font-size: 14px; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Password Modal -->
    <div id="login-modal">
        <div class="modal-content">
            <h2>Admin Access</h2>
            <p id="error-msg">Incorrect password.</p>
            <input type="password" id="admin-pass" placeholder="Enter Admin Password">
            <button onclick="attemptLogin()">Unlock Dashboard</button>
        </div>
    </div>

    <!-- Main Content -->
    <h1>Scan to Mark Attendance</h1>
    <div id="timer">Refreshing in <span id="countdown">45</span>s</div>
    
    <div id="qr-container">
        <div id="qrcode"></div>
    </div>

    <!-- Settings -->
    <div class="settings-panel">
        <h3>Dashboard Settings</h3>
        <div class="input-group">
            <label>QR Validity Duration (Seconds)</label>
            <input type="number" id="lifespan-input" value="45" min="10" max="300">
        </div>
        <p style="font-size: 12px; color: #a4b0be; margin-bottom: 0;">Changes take effect on the next refresh.</p>
    </div>

    <script>
        let adminPassword = "";
        let refreshInterval = null;
        let countdownInterval = null;

        function attemptLogin() {
            adminPassword = document.getElementById('admin-pass').value;
            fetchToken(true);
        }

        async function fetchToken(isInitialLogin = false) {
            const lifespan = document.getElementById('lifespan-input').value || 45;
            
            try {
                const response = await fetch(`/api/admin/generate-qr-token?lifespan=${lifespan}`, {
                    headers: { 'X-Admin-Password': adminPassword }
                });

                if (response.status === 401) {
                    document.getElementById('login-modal').style.display = 'flex';
                    if (!isInitialLogin) document.getElementById('error-msg').style.display = 'block';
                    clearInterval(refreshInterval);
                    clearInterval(countdownInterval);
                    return;
                }

                const data = await response.json();
                document.getElementById('login-modal').style.display = 'none';
                
                // Clear old QR
                document.getElementById('qrcode').innerHTML = "";
                
                // Generate a massive 1024x1024 high-res QR code (CSS will scale it perfectly)
                new QRCode(document.getElementById("qrcode"), {
                    text: data.scan_url,
                    width: 1024,
                    height: 1024,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                startCountdown(data.expires_in);

            } catch (err) {
                console.error("Error fetching token", err);
            }
        }

        function startCountdown(seconds) {
            clearInterval(refreshInterval);
            clearInterval(countdownInterval);
            
            let timeLeft = seconds;
            document.getElementById('countdown').innerText = timeLeft;
            
            countdownInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = timeLeft;
            }, 1000);

            refreshInterval = setTimeout(() => fetchToken(), seconds * 1000);
        }
    </script>
</body>
</html>
