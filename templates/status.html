<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --card: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.09);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --success: #22c55e;
            --error: #ef4444;
            --radius: 28px;
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--bg);
            background-attachment: fixed;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 30% 30%, rgba(99, 102, 241, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 70% 70%, rgba(139, 92, 246, 0.11) 0%, transparent 45%);
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .container {
            background: var(--card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            padding: 48px 36px;
            border-radius: var(--radius);
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(24px) scale(0.96);
            animation: enter 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes enter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 36px;
            margin: 0 auto 24px;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.06);
        }

        .success .icon {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.35);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.25);
            animation: pop 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .error .icon {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.35);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.25);
            animation: shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        h1 {
            font-size: clamp(1.6rem, 3vw, 2rem);
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .success h1 { color: var(--text); }
        .error h1 { color: var(--text); }

        p {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 22px;
            font-weight: 400;
        }

        .email-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            font-size: 0.92rem;
            color: var(--text);
            font-family: 'Space Mono', monospace;
            font-weight: 600;
            margin-top: 6px;
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.3);
        }

        .email-chip span {
            color: var(--text-muted);
            font-size: 0.82rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        @media (max-width: 480px) {
            .container { padding: 36px 24px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container {% if success %}success{% else %}error{% endif %}">
            {% if success %}
                <div class="icon">✓</div>
                <h1>Attendance Marked</h1>
                <p>{{ message }}</p>
                {% if email %}
                    <div class="email-chip"><span>Verified identity</span><br>{{ email }}</div>
                {% endif %}
            {% else %}
                <div class="icon">⚠</div>
                <h1>Not Recorded</h1>
                <p>{{ message }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
